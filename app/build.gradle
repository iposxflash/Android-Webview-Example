plugins {
    id 'com.android.application'
    // Tambahkan plugin kotlin-android jika Anda menggunakan Kotlin
    // id 'org.jetbrains.kotlin.android' 
}

def releasePropsFile = rootProject.file('release.properties')
def releaseProps = new Properties()
if (releasePropsFile.exists()) {
    releaseProps.load(new FileInputStream(releasePropsFile))
}

android {
    // 1. UPDATE: Gunakan SDK 34 untuk standar terbaru
    compileSdk 34
    namespace 'com.musik.offline' // Sesuaikan dengan id aplikasi Anda

    defaultConfig {
        applicationId "com.musik.offline" // Sesuaikan dengan id aplikasi Anda
        minSdk 23
        // 2. UPDATE: Target SDK harus 34 agar tidak diblokir Play Protect
        targetSdk 34 
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Pastikan file .jks Anda diletakkan di folder android/app/
            storeFile file(releaseProps.getProperty('storeFile') ?: "release-key.jks") 
            storePassword releaseProps.getProperty('storePassword') ?: "" 
            keyAlias releaseProps.getProperty('keyAlias') ?: "" 
            keyPassword releaseProps.getProperty('keyPassword') ?: ""
        }
    }

    buildTypes {
        release {
            // 3. UPDATE: Aktifkan minifyEnabled & shrinkResources untuk keamanan
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 4. UPDATE: Gunakan versi library yang lebih stabil/baru
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
